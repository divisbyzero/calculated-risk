# Project-local latexindent preferences.
# Only settings that differ from, or are worth explicitly confirming against,
# latexindent defaults are listed here.

# --- Backup settings (apply when using the -w / -wd switch) ---
backupExtension: .bak       # Suffix appended to backup filenames (e.g. myfile.bak0).
onlyOneBackUp: 0            # 0 = numbered backups (.bak0, .bak1, ...); 1 = overwrite a single backup.
maxNumberOfBackUps: 0       # Maximum backups to keep; 0 = unlimited.
cycleThroughBackUps: 0      # 1 = delete the oldest backup and shift remaining ones when the max is reached.

# --- Preamble and indentation ---
indentPreamble: 0           # 0 = do not indent the document preamble.
defaultIndent: "  "         # Indentation unit per nesting level (2 spaces).
maximumIndentation: ""      # Maximum indentation allowed; "" = no cap.

# --- Whitespace ---
removeTrailingWhitespace:
  beforeProcessing: 0       # 0 = preserve trailing whitespace in the input before processing.
  afterProcessing: 1        # 1 = strip trailing whitespace from the output.

# --- noAdditionalIndent: suppress extra indentation for specific named blocks ---
noAdditionalIndent:
  document: 1               # Suppress extra indentation inside the document environment.  
  itemize: 0               # Suppress extra indentation inside the itemize environment.
  enumerate: 0               # Suppress extra indentation inside the enumerate environment.

indentAfterItems:
  itemize: 1
  itemize*: 1
  enumerate: 1
  enumerate*: 1
  description: 1
  description*: 1

# --- noAdditionalIndentGlobal: suppress extra indentation globally by block type ---
# All values below are latexindent defaults (0) unless noted.
noAdditionalIndentGlobal:
  environments: 0                      # 0 = indent inside environments.
  commands: 0                          # 0 = indent command arguments.
  optionalArguments: 0                 # 0 = indent optional arguments.
  mandatoryArguments: 0                # 0 = indent mandatory arguments.
  ifElseFi: 0                          # 0 = indent inside \if...\fi conditionals.
  items: 1                             # 1 = do not indent content after \item.
  keyEqualsValuesBracesBrackets: 0     # 0 = indent key=value blocks (e.g. TikZ options).
  namedGroupingBracesBrackets: 0       # 0 = indent named grouping blocks.
  UnNamedGroupingBracesBrackets: 0     # 0 = indent unnamed grouping blocks.
  specialBeginEnd: 0                   # 0 = indent special begin/end blocks (e.g. \[…\]).
  afterHeading: 0                      # 0 = indent content after sectioning commands.

# --- indentRulesGlobal: override the indentation string globally by block type ---
# A non-zero value replaces defaultIndent for that block type.
# All set to 0 (no override); defaultIndent applies everywhere.
indentRulesGlobal:
  environments: 0
  commands: 0
  optionalArguments: 0
  mandatoryArguments: 0
  ifElseFi: 0
  items: 0
  keyEqualsValuesBracesBrackets: 0
  namedGroupingBracesBrackets: 0
  UnNamedGroupingBracesBrackets: 0
  specialBeginEnd: 0
  afterHeading: 0

indentRules:
  item: "  "   # 2 spaces of indentation after \item