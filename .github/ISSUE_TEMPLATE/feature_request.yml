name: Feature request
description: Suggest an idea or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help?
      description: How would you use it in your class?
